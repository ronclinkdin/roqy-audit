# gitleaks config for roqy-audit
#
# gitleaks 8.24.3 (the version gitleaks-action runs) applies [allowlist].paths.
# [[extend.allowlists]] is not applied by that version.
#
# docs/runs/*.md are audit reports. Earlier versions quoted secret VALUES they
# found in the audited repo (that itself was a process violation, fixed: values
# are now redacted to 4 chars). The pre-redaction versions remain in git
# history, so history scans flag them. The affected secrets belong to the
# roqy.io website stack and are being rotated.
#
# lab/ is the vulnerable sandbox. Credential-shaped strings there are planted
# fixtures (AKIAFAKE..., ghp_FAKE..., sk_live_FAKE...), not real secrets.
# The path allowlist does not cover anything outside lab/ and docs/runs/.

[extend]
useDefault = true

[allowlist]
description = "Historical audit reports and intentional lab fixtures"
paths = [
  '''docs/runs/.*\.md''',
  '''lab/.*''',
]
