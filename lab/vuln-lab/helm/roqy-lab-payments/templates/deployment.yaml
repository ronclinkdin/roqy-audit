apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command: ["sleep", "infinity"]
        envFrom:
        - configMapRef: {name: {{ .Release.Name }}-config}
        env:
        - name: DB_PASSWORD
          value: {{ .Values.db.password | quote }}
