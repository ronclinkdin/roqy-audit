# GENERATED by scripts/gen_expected.py - edit that file, not this one.
schema_version: 1
lab: roqy vuln-lab
severity_scale: P0 critical / P1 high / P2 medium / P3 low-info
conditions:
  allow_public: terraform var allow_public=true
  foreign_account: var foreign_account_id set to a 2nd account
  instance: var instance_state != none (default running)
  weak_trail: var create_weak_trail=true
  no_weak_trail: var create_weak_trail=false (default)
  dns: var dns_zone_type != none (default private)
  rds: var enable_rds=true (default)
  eks: var enable_eks=true (default)
  eks_old_version: var eks_version set to a version in extended support
  second_region: var enable_second_region=true (default)
  secrets_manager: var enable_secrets_manager=true
  codebuild_webhook: var codebuild_webhook_repo_url set
  kms_deletion: var schedule_kms_deletion=true (default)
  envelope: scripts/apply-envelope.sh deployed (envelope/, client-repo/, k8s/, helm/) - default ON
  absence_intact: the sandbox owner has NOT enabled this account-level control manually (verify with the detect command first)
default_on_conditions:
- absence_intact
- dns
- eks
- envelope
- instance
- kms_deletion
- no_weak_trail
- rds
- second_region
matching: 'A plant counts as detected when a finding has one of expected_check_ids AND mentions `resource` (or, for kind=absence with resource=account,
  only the check id). NEW-* ids do not exist in CHECKS-AWS.md yet: they are the gaps to add.'
