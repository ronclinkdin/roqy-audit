criteria:
  CC6.1: Logical access — restrict and identify who can reach systems and data.
  CC6.3: Least privilege — access is limited to what the role needs.
  CC6.6: Boundaries — external and untrusted input does not become trusted execution.
  CC6.7: Restricted data — secrets and credentials are not stored or copied in the clear.
  CC7.1: Detection — vulnerabilities and changes are noticed, not only prevented.
  CC8.1: Change control — what runs in production is pinned, reviewed, and attributable.
  CC9.2: Vendor and supply risk — third-party code and tools are identified and constrained.
